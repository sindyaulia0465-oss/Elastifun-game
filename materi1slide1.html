<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        height: 100vh;
      }

      .background {
        position: relative;
        width: 100%;
        height: 100vh;
        background: url("gbmateri1slide1.jpg.jpg") no-repeat center center;
        background-size: 80%;
        background-color: #08152f;
      }

      .bottom-buttons {
        position: absolute;
        left: 23%;
        bottom: 30px;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        z-index: 9999;
      }

      .btn {
        border: none;
        padding: 14px 28px;
        border-radius: 15px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .prev {
        background: #27467a;
        color: white;
      }

      .next {
        background: #d89b14;
        color: white;
      }

      .btn:hover {
        transform: translateY(-3px);
      }

      @media (max-width: 1024px) {
        .background {
          background-size: contain;
          background-color: #8ecfff;
        }

        .bottom-buttons {
          left: 24%;
          bottom: 20px;
        }

        .btn {
          padding: 12px 22px;
          font-size: 16px;
        }
      }

      @media (max-width: 768px) {
        .background {
          background-size: contain;
          background-position: center;
        }

        .bottom-buttons {
          left: 26%;
          bottom: 15px;
          gap: 10px;
        }

        .btn {
          padding: 10px 18px;
          font-size: 14px;
          border-radius: 12px;
        }
      }

      @media (max-width: 480px) {
        .bottom-buttons {
          left: 28px;
          bottom: 10px;
        }

        .btn {
          padding: 8px 14px;
          font-size: 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="background">
      <div class="bottom-buttons">
        <button class="btn prev" onclick="Sebelumnya()">⬅ Sebelumnya</button>

        <button class="btn next" onclick="Selanjutnya()">Selanjutnya ➜</button>
      </div>

      <script>
        function Sebelumnya() {
          window.location.href = "materi1slide1.html";
        }

        function Selanjutnya() {
          window.location.href = "materi1slide2.html";
        }
      </script>
    </div>
  </body>
</html>
