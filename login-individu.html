<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Pemain - Elastifun</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background:
          linear-gradient(rgba(10, 25, 60, 0.85), rgba(10, 25, 60, 0.9)),
          url("background.jpg");
        background-size: cover;
        background-position: center;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .login-box {
        width: 100%;
        max-width: 400px;
        background: rgba(14, 34, 71, 0.95);
        border-radius: 20px;
        padding: 40px 30px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        border: 2px solid #ffc94a;
        text-align: center;
      }
      h2 {
        color: #ffc94a;
        margin-bottom: 10px;
        font-size: 24px;
      }
      p {
        color: #ccc;
        font-size: 14px;
        margin-bottom: 25px;
      }
      .form-group {
        text-align: left;
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #ffc94a;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 12px 15px;
        border-radius: 8px;
        border: 1px solid #2a7c4b;
        background: rgba(10, 25, 60, 0.8);
        color: white;
        font-size: 16px;
      }
      input:focus {
        outline: none;
        border-color: #ffc94a;
      }
      .btn-masuk {
        width: 100%;
        background: #d89b14;
        color: white;
        border: none;
        padding: 14px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.2s;
      }
      .btn-masuk:hover {
        background: #ffc94a;
        color: #0a193c;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>🎯 MULAI TANTANGAN</h2>
      <p>Masukkan identitas aslimu untuk memulai kuis individu</p>

      <div class="form-group">
        <label>NAMA LENGKAP SISWA</label>
        <input
          type="text"
          id="txtNamaSiswa"
          placeholder="Contoh: Ahmad Fauzi"
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label>NOMOR ABSEN</label>
        <input
          type="number"
          id="txtNoAbsen"
          placeholder="Contoh: 07"
          min="1"
          max="50"
        />
      </div>

      <button class="btn-masuk" onclick="prosesLogin()">
        MULAI BERMAIN ▶️
      </button>
    </div>

    <script>
      function prosesLogin() {
        let nama = document.getElementById("txtNamaSiswa").value.trim();
        let absen = document.getElementById("txtNoAbsen").value.trim();

        if (nama === "" || absen === "") {
          alert("Wajib mengisi nama dan nomor absen terlebih dahulu!");
          return;
        }

        // Menyimpan identitas asli siswa secara lokal
        localStorage.setItem("namaSiswa", nama);
        localStorage.setItem("noAbsen", absen);

        // Pindah otomatis ke halaman game kuis
        window.location.href = "gamecocologi.html";
      }
    </script>
  </body>
</html>
