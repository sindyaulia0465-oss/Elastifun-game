<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cocologi - Kurva Elastisitas</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background:
          linear-gradient(rgba(10, 25, 60, 0.85), rgba(10, 25, 60, 0.9)),
          url("background.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: white;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .game-box {
        width: 100%;
        max-width: 700px;
        background: rgba(14, 34, 71, 0.95);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        border: 2px solid #ffc94a;
        text-align: center;
      }

      h1 {
        color: #ffc94a;
        font-size: 26px;
        margin-bottom: 5px;
      }
      .rules {
        color: #ccc;
        font-size: 14px;
        font-style: italic;
        margin-bottom: 25px;
      }

      /* Statistik Atas */
      .stats-row {
        display: flex;
        justify-content: space-around;
        margin-bottom: 25px;
        background: rgba(10, 25, 60, 0.8);
        padding: 15px;
        border-radius: 12px;
      }
      .stat-item h3 {
        font-size: 11px;
        color: #ffc94a;
        text-transform: uppercase;
      }
      .stat-item p {
        font-size: 18px;
        font-weight: bold;
      }

      /* Kartu Soal Utama */
      .clue-card {
        background: #0a193c;
        border: 2px dashed #ffc94a;
        border-radius: 15px;
        padding: 30px 20px;
        margin-bottom: 25px;
      }
      .clue-title {
        font-size: 13px;
        color: #ffc94a;
        letter-spacing: 2px;
        margin-bottom: 10px;
      }
      .clue-word {
        font-size: 32px;
        font-weight: bold;
        color: #fff;
        text-transform: uppercase;
      }

      /* Grid Pilihan Kartu Jawaban */
      .answers-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        margin-bottom: 10px;
      }

      .card-btn {
        background: #2a7c4b;
        color: white;
        border: none;
        padding: 20px 15px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80px;
      }

      .card-btn:hover {
        background: #34965b;
        transform: translateY(-3px);
      }
      .card-btn:active {
        transform: translateY(1px);
      }

      /* Jendela Pop-up (Modal) */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: #0e2247;
        padding: 35px;
        border-radius: 15px;
        text-align: center;
        max-width: 450px;
        width: 90%;
        border: 2px solid #ffc94a;
      }
      .modal-content h2 {
        margin-bottom: 15px;
        color: #ffc94a;
      }
      .modal-content p {
        margin-bottom: 20px;
        font-size: 16px;
        line-height: 1.5;
        white-space: pre-line;
      }
      .modal-btn {
        background: #d89b14;
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        .answers-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-box">
      <h1>🧩 COCOLOGI ELASTISITAS</h1>
      <p class="rules">
        Cocokkan istilah/barang di atas dengan jenis kurva yang tepat di bawah!
      </p>

      <!-- BAR INFORMASI -->
      <div class="stats-row">
        <div class="stat-item">
          <h3>Siswa</h3>
          <p id="lblNama">Memuat...</p>
        </div>
        <div class="stat-item">
          <h3>Progress Kartu</h3>
          <p id="lblProgress">1 / 5</p>
        </div>
        <div class="stat-item">
          <h3>Skor</h3>
          <p id="lblSkor" style="color: #00ff88">100</p>
        </div>
      </div>

      <!-- KARTU UTAMA (PERTANYAAN) -->
      <div class="clue-card">
        <div class="clue-title">KARTU MATERI / BARANG:</div>
        <div class="clue-word" id="lblKataSoal">MEMUAT...</div>
      </div>

      <!-- PILIHAN KARTU JAWABAN -->
      <div class="answers-grid" id="gridJawaban">
        <!-- Diisi otomatis oleh JavaScript -->
      </div>
    </div>

    <!-- POP-UP HASIL JAWABAN & SELESAI -->
    <div class="modal" id="gameModal">
      <div class="modal-content">
        <h2 id="modalTitle">🎉 BENAR!</h2>
        <p id="modalFeedback">Analisis kurva kamu sangat akurat.</p>
        <button class="modal-btn" id="modalActionBtn" onclick="tutupModal()">
          Lanjut Kartu Berikutnya
        </button>
      </div>
    </div>

    <script>
      // DATABASE UTAMA: 30 Soal Variasi Elastisitas Permintaan & Penawaran
      const bankSoal30 = [
        {
          soal: "Elastis",
          jawaban: "Kurva Landai (E > 1)",
          opsi: [
            "Kurva Landai (E > 1)",
            "Kurva Curam (E < 1)",
            "Kurva Tegak Vertikal",
            "Kurva Datar Horizontal",
          ],
        },
        {
          soal: "Inelastis",
          jawaban: "Kurva Curam (E < 1)",
          opsi: [
            "Kurva Curam (E < 1)",
            "Kurva Landai (E > 1)",
            "Kurva Diagonal Miring Pas",
            "Kurva Datar Horizontal",
          ],
        },
        {
          soal: "Unitary Elastis",
          jawaban: "Kurva Diagonal Miring Pas (E = 1)",
          opsi: [
            "Kurva Diagonal Miring Pas (E = 1)",
            "Kurva Tegak Vertikal",
            "Kurva Landai (E > 1)",
            "Kurva Curam (E < 1)",
          ],
        },
        {
          soal: "Elastis Sempurna",
          jawaban: "Kurva Datar Horizontal (E = ~)",
          opsi: [
            "Kurva Datar Horizontal (E = ~)",
            "Kurva Tegak Vertikal (E = 0)",
            "Kurva Landai (E > 1)",
            "Kurva Curam (E < 1)",
          ],
        },
        {
          soal: "Inelastis Sempurna",
          jawaban: "Kurva Tegak Vertikal (E = 0)",
          opsi: [
            "Kurva Tegak Vertikal (E = 0)",
            "Kurva Datar Horizontal (E = ~)",
            "Kurva Diagonal Miring Pas",
            "Kurva Landai (E > 1)",
          ],
        },
        {
          soal: "Beras dan Garam",
          jawaban: "Kurva Curam (Inelastis / Pokok)",
          opsi: [
            "Kurva Curam (Inelastis / Pokok)",
            "Kurva Landai (Elastis / Mewah)",
            "Kurva Datar Horizontal",
            "Kurva Tegak Vertikal",
          ],
        },
        {
          soal: "Mobil Mewah",
          jawaban: "Kurva Landai (Elastis / Mewah)",
          opsi: [
            "Kurva Landai (Elastis / Mewah)",
            "Kurva Curam (Inelastis)",
            "Kurva Tegak Vertikal",
            "Kurva Diagonal Miring Pas",
          ],
        },
        {
          soal: "Obat-obatan Darurat",
          jawaban: "Kurva Tegak Vertikal (Inelastis Sempurna)",
          opsi: [
            "Kurva Tegak Vertikal (Inelastis Sempurna)",
            "Kurva Datar Horizontal",
            "Kurva Landai",
            "Kurva Curam",
          ],
        },
        {
          soal: "Bensin dan Listrik",
          jawaban: "Kurva Curam (Inelastis / Pokok)",
          opsi: [
            "Kurva Curam (Inelastis / Pokok)",
            "Kurva Landai",
            "Kurva Datar Horizontal",
            "Kurva Diagonal Miring Pas",
          ],
        },
        {
          soal: "Karya Seni Langka",
          jawaban: "Kurva Tegak Vertikal (Inelastis Sempurna)",
          opsi: [
            "Kurva Tegak Vertikal (Inelastis Sempurna)",
            "Kurva Datar Horizontal",
            "Kurva Landai",
            "Kurva Curam",
          ],
        },
        {
          soal: "Koefisien E > 1",
          jawaban: "Kurva Landai (Elastis)",
          opsi: [
            "Kurva Landai (Elastis)",
            "Kurva Curam (Inelastis)",
            "Kurva Tegak Vertikal",
            "Kurva Datar Horizontal",
          ],
        },
        {
          soal: "Koefisien E < 1",
          jawaban: "Kurva Curam (Inelastis)",
          opsi: [
            "Kurva Curam (Inelastis)",
            "Kurva Landai (Elastis)",
            "Kurva Diagonal Miring Pas",
            "Kurva Datar Horizontal",
          ],
        },
        {
          soal: "Koefisien E = 1",
          jawaban: "Kurva Diagonal Miring Pas (Unitary)",
          opsi: [
            "Kurva Diagonal Miring Pas (Unitary)",
            "Kurva Tegak Vertikal",
            "Kurva Datar Horizontal",
            "Kurva Landai",
          ],
        },
        {
          soal: "Koefisien E = 0",
          jawaban: "Kurva Tegak Vertikal (Inelastis Sempurna)",
          opsi: [
            "Kurva Tegak Vertikal (Inelastis Sempurna)",
            "Kurva Datar Horizontal",
            "Kurva Landai",
            "Kurva Curam",
          ],
        },
        {
          soal: "Koefisien E = Tak Terhingga",
          jawaban: "Kurva Datar Horizontal (Elastis Sempurna)",
          opsi: [
            "Kurva Datar Horizontal (Elastis Sempurna)",
            "Kurva Tegak Vertikal",
            "Kurva Landai",
            "Kurva Curam",
          ],
        },
        {
          soal: "Pembeli Sangat Sensitif Harga",
          jawaban: "Kurva Landai (Elastis)",
          opsi: [
            "Kurva Landai (Elastis)",
            "Kurva Curam (Inelastis)",
            "Kurva Tegak Vertikal",
            "Kurva Datar Horizontal",
          ],
        },
        {
          soal: "Pembeli Kurang Peduli Harga",
          jawaban: "Kurva Curam (Inelastis)",
          opsi: [
            "Kurva Curam (Inelastis)",
            "Kurva Landai (Elastis)",
            "Kurva Diagonal Miring Pas",
            "Kurva Datar Horizontal",
          ],
        },
        {
          soal: "Pasar Internasional (Gandum/Minyak)",
          jawaban: "Kurva Datar Horizontal (Elastis Sempurna)",
          opsi: [
            "Kurva Datar Horizontal (Elastis Sempurna)",
            "Kurva Tegak Vertikal",
            "Kurva Landai",
            "Kurva Curam",
          ],
        },
        {
          soal: "Jumlah Lahan dan Tanah",
          jawaban: "Kurva Tegak Vertikal (Inelastis Sempurna)",
          opsi: [
            "Kurva Tegak Vertikal (Inelastis Sempurna)",
            "Kurva Datar Horizontal",
            "Kurva Landai",
            "Kurva Curam",
          ],
        },
        {
          soal: "Perhiasan Berlian",
          jawaban: "Kurva Landai (Elastis / Mewah)",
          opsi: [
            "Kurva Landai (Elastis / Mewah)",
            "Kurva Curam (Inelastis)",
            "Kurva Tegak Vertikal",
            "Kurva Diagonal Miring Pas",
          ],
        },
        {
          soal: "Sangat Banyak Barang Substitusi",
          jawaban: "Kurva Landai (Makin Banyak Pengganti = Makin Elastis)",
          opsi: [
            "Kurva Landai (Makin Banyak Pengganti = Makin Elastis)",
            "Kurva Curam (Inelastis)",
            "Kurva Tegak Vertikal",
            "Kurva Diagonal Miring Pas",
          ],
        },
        {
          soal: "Tidak Ada Barang Pengganti",
          jawaban: "Kurva Curam (Inelastis)",
          opsi: [
            "Kurva Curam (Inelastis)",
            "Kurva Landai (Elastis)",
            "Kurva Datar Horizontal",
            "Kurva Diagonal Miring Pas",
          ],
        },
        {
          soal: "Air Minum Kemasan Banyak Merek",
          jawaban: "Kurva Landai (Elastis)",
          opsi: [
            "Kurva Landai (Elastis)",
            "Kurva Curam (Inelastis)",
            "Kurva Tegak Vertikal",
            "Kurva Datar Horizontal",
          ],
        },
        {
          soal: "Kebutuhan Sekunder",
          jawaban: "Kurva Landai (Elastis)",
          opsi: [
            "Kurva Landai (Elastis)",
            "Kurva Curam (Inelastis)",
            "Kurva Tegak Vertikal",
            "Kurva Datar Horizontal",
          ],
        },
        {
          soal: "Kebutuhan Primer / Pokok",
          jawaban: "Kurva Curam (Inelastis)",
          opsi: [
            "Kurva Curam (Inelastis)",
            "Kurva Landai (Elastis)",
            "Kurva Datar Horizontal",
            "Kurva Tegak Vertikal",
          ],
        },
        {
          soal: "Stok Barang Gudang Melimpah",
          jawaban: "Kurva Landai (Penawaran Elastis)",
          opsi: [
            "Kurva Landai (Penawaran Elastis)",
            "Kurva Curam (Inelastis)",
            "Kurva Tegak Vertikal",
            "Kurva Datar Horizontal",
          ],
        },
        {
          soal: "Produksi Butuh Waktu Sangat Lama",
          jawaban: "Kurva Curam (Penawaran Inelastis)",
          opsi: [
            "Kurva Curam (Penawaran Inelastis)",
            "Kurva Landai (Elastis)",
            "Kurva Diagonal Miring Pas",
            "Kurva Datar Horizontal",
          ],
        },
        {
          soal: "Smartphone Flagship Terbaru",
          jawaban: "Kurva Landai (Elastis / Mewah)",
          opsi: [
            "Kurva Landai (Elastis / Mewah)",
            "Kurva Curam (Inelastis)",
            "Kurva Tegak Vertikal",
            "Kurva Diagonal Miring Pas",
          ],
        },
        {
          soal: "Susu Formula Bayi Khusus",
          jawaban: "Kurva Curam (Inelastis / Sangat Butuh)",
          opsi: [
            "Kurva Curam (Inelastis / Sangat Butuh)",
            "Kurva Landai",
            "Kurva Datar Horizontal",
            "Kurva Tegak Vertikal",
          ],
        },
        {
          soal: "Tiket Pesawat Mudik Lebaran",
          jawaban: "Kurva Curam (Inelastis / Harus Tetap Beli)",
          opsi: [
            "Kurva Curam (Inelastis / Harus Tetap Beli)",
            "Kurva Landai",
            "Kurva Datar Horizontal",
            "Kurva Tegak Vertikal",
          ],
        },
      ];

      let soalPaketSiswa = [];
      let nomorIndex = 0;
      let skor = 100;
      const LIMIT_SOAL = 5;

      // Load identitas siswa dari localStorage halaman login_individu
      let namaSiswa = localStorage.getItem("namaSiswa") || "Siswa";
      let noAbsen = localStorage.getItem("noAbsen") || "00";
      document.getElementById("lblNama").innerText =
        `${namaSiswa} (${noAbsen})`;

      // Eksekusi pengacakan pertama kali game dibuka
      inisialisasiGame();

      function inisialisasiGame() {
        // Ambil 5 soal secara acak murni dari total 30 bank soal
        soalPaketSiswa = [...bankSoal30]
          .sort(() => Math.random() - 0.5)
          .slice(0, LIMIT_SOAL);
        nomorIndex = 0;
        skor = 100;
        document.getElementById("lblSkor").innerText = skor;
        muatSoalKeLayar();
      }

      function muatSoalKeLayar() {
        // Jika jatah 5 soal sudah terpenuhi, panggil fungsi akhir game
        if (nomorIndex >= LIMIT_SOAL) {
          selesariGameLengkap();
          return;
        }

        // Update Tampilan Indikator Progress Angka Soal (1/5 s.d 5/5)
        document.getElementById("lblProgress").innerText =
          `${nomorIndex + 1} / ${LIMIT_SOAL}`;

        let dataKini = soalPaketSiswa[nomorIndex];
        document.getElementById("lblKataSoal").innerText = dataKini.soal;

        // Acak urutan letak tombol pilihan jawaban agar posisi tombol selalu berubah
        let opsiAcak = [...dataKini.opsi].sort(() => Math.random() - 0.5);

        const grid = document.getElementById("gridJawaban");
        grid.innerHTML = "";

        // Render tombol jawaban secara dinamis ke layar
        opsiAcak.forEach((pilihanText) => {
          const btn = document.createElement("button");
          btn.className = "card-btn";
          btn.innerText = pilihanText;
          btn.onclick = () => verifikasiCocologi(pilihanText);
          grid.appendChild(btn);
        });
      }

      function verifikasiCocologi(pilihanUser) {
        let dataKini = soalPaketSiswa[nomorIndex];
        const modal = document.getElementById("gameModal");

        if (pilihanUser === dataKini.jawaban) {
          document.getElementById("modalTitle").innerText = "🎉 COCOK!";
          document.getElementById("modalFeedback").innerText =
            `Hebat! Analisis kamu tepat sekali.\nKarakteristik "${dataKini.soal}" memang diwakili oleh: \n👉 ${dataKini.jawaban}`;
        } else {
          document.getElementById("modalTitle").innerText = "❌ KURANG PAS";
          document.getElementById("modalFeedback").innerText =
            `Waduh, hubungan logikanya keliru!\nJawaban yang benar adalah:\n👉 ${dataKini.jawaban}\n\nSkor kamu dikurangi 20 poin!`;
          skor = Math.max(0, skor - 20);
          document.getElementById("lblSkor").innerText = skor;
        }

        // LOGIKA KUNCI: Indeks nomor soal langsung bertambah di sini agar saat menutup modal, soal langsung berganti
        nomorIndex++;
        modal.style.display = "flex";
      }

      function tutupModal() {
        document.getElementById("gameModal").style.display = "none";
        muatSoalKeLayar();
      }

      function selesariGameLengkap() {
        // Menyimpan data hasil skor ke localStorage papan peringkat utama kelas
        let dataLeaderboard =
          JSON.parse(localStorage.getItem("elastifun_leaderboard")) || [];
        dataLeaderboard.push({
          kelompok: `${namaSiswa} [Absen ${noAbsen}] (Cocologi Kurva)`,
          skorAkhir: skor,
        });
        dataLeaderboard.sort((a, b) => b.skorAkhir - a.skorAkhir);
        localStorage.setItem(
          "elastifun_leaderboard",
          JSON.stringify(dataLeaderboard),
        );

        document.getElementById("modalTitle").innerText =
          "🏆 TANTANGAN SELESAI!";
        document.getElementById("modalFeedback").innerText =
          `Selamat ${namaSiswa}!\nKamu sukses menaklukkan 5 paket kartu acak dengan Skor Akhir: ${skor} Poin.`;

        const btnAction = document.getElementById("modalActionBtn");
        btnAction.innerText = "Lihat Peringkat Kelas";
        btnAction.onclick = () => {
          window.location.href = "leaderboard.html";
        };
        document.getElementById("gameModal").style.display = "flex";
      }
    </script>
  </body>
</html>
