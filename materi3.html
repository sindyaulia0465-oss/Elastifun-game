<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        height: 100vh;
      }

      .background {
        position: relative;
        width: 100%;
        height: 100vh;
        background: url("bgelastisitassilang&substitusi.jpg") no-repeat center
          center;
        background-size: 80%;
        background-color: #08152f;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.15);
        pointer-events: none;
      }

      .badge {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #d89b14;
        padding: 12px 30px;
        border-radius: 40px;
        font-weight: bold;
        font-size: 18px;
        color: white;
        z-index: 10;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      .prev-btn {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: none;
        background: rgba(10, 25, 60, 0.8);
        color: white;
        font-size: 35px;
        cursor: pointer;
        transition: 0.3s;
        z-index: 10;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
      }

      .prev-btn:hover {
        transform: translateY(-50%) scale(1.1);
        background: #27467a;
      }

      .next-btn {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: none;
        background: #d89b14;
        color: white;
        font-size: 35px;
        cursor: pointer;
        transition: 0.3s;
        z-index: 10;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
      }

      .next-btn:hover {
        transform: translateY(-50%) scale(1.1);
      }

      .bottom-buttons {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
        z-index: 10;
      }

      .btn {
        border: none;
        padding: 14px 28px;
        border-radius: 15px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .back {
        background: #f169eb;
        color: white;
      }

      .start {
        background: #860d62;
        color: white;
      }

      .btn:hover {
        transform: translateY(-3px);
      }

      .landscape-warning {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #08152f;
        color: white;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 30px;
        z-index: 9999;
        font-size: 22px;
      }

      @media screen and (orientation: portrait) and (max-width: 900px) {
        .landscape-warning {
          display: flex;
        }
      }

      @media screen and (max-width: 1024px) {
        .background {
          background-size: 90%;
        }
      }

      @media screen and (max-width: 932px) and (orientation: landscape) {
        .background {
          background-size: 85%;
        }
      }

      prev-btn,
      .next-btn {
        width: 60px;
        height: 60px;
        font-size: 28px;
      }

      .badge {
        font-size: 14px;
        padding: 10px 20px;
      }

      .bottom-buttons {
        bottom: 15px;
        gap: 12px;
      }

      .btn {
        font-size: 14px;
        padding: 10px 18px;
      }

      @media screen and (max-width: 768px) {
        background {
          background-size: 95%;
        }
      }
    </style>
  </head>

  <body>
    <div class="background">
      <div class="overlay"></div>

      <div class="bottom-buttons">
        <button class="btn back" onclick="KembaliKeMenu()">⬅ Kembali</button>

        <button class="btn start" onclick="mulaiMateri()">
          Mulai Materi 🚀
        </button>
      </div>
    </div>

    <script>
      function KembaliKeMenu() {
        window.location.href = "halaman2-panduan.html";
      }

      function mulaiMateri() {
        window.location.href = "materi3slide1.html";
      }

      function Sebelumnya() {
        window.location.href = "halaman2-panduan.html";
      }

      function Selanjutnya() {
        window.location.href = "materi3slide1.html";
      }
    </script>
  </body>
</html>
